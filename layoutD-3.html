<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 D-3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        #aside {
            width: 200px; 
            height: 850px;
            background-color: #f123ff;
        }
        #aside .logo {
            width: 100%;
            height: 150px;
            background-color: #1f1f11;
        }
        #aside .nav {
            width: 100%;
            height: 700px;
            background-color: #abcdef;
        }
        #main {
            width: calc(100% - 200px);
            height: 850px;
            background-color: #1ff;
        }
        #slider {
            width: 100%;
            height: 400px;
            background-color: #f10;
        }
        #contents {
            width: 100%;
            height: 400px;
            background-color: #12ff11;
        }
        #contents .content1 {
            width: 100%;
            height: 200px;
            background-color: #f1ff11;
        }
        #contents .content2 {
            width: 100%;
            height: 250px;
            background-color: #dbffd1;
        }
        #footer {
            width: 100%;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 120px;
            background-color: #654321;
        }
        #footer .footer2 {
            width: 80%;
            height: 120px;
            background-color: #214665;
        }
        #footer .footer2 .footer2-1 {
            width: 100%;
            height: 60px;
            background-color: #f1f1f1;
        }
        #footer .footer2 .footer2-2 {
            width: 100%;
            height: 60px;
            background-color: #c1d5cd;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <main id="main">
            <article id="slider">
                <div class="banner"></div>
            </article>
            <section id="contents">
                <section class="content1"></section>
                <section class="content2"></section>
            </section>
        </main>
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </footer>
    </div>
</body>
</html>
