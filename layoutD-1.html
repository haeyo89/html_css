<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 D-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        #aside {
            width: 200px;
            height: 850px;
            background-color: #f9f;
        }
        #aside .logo {
            width: 100%;
            height: 100px;
            background-color: #a32f2f;
        }
        #aside .nav {
            width: 100%;
            height: 750px;
            background-color: #4052b6;
        }
        #main {
            width: calc(100% - 200px);
            height: 850px;
            background-color: #ba8e36;
        }
        #slider {
            width: 100%;
            height: 400px;
            background-color: #f11fff;
        }
        #slider .link {
            position: absolute;
            right: 0;
            top: 0;
            width: 100px;
            height: 300px;
            background-color: #12f;
        }
        #banner {
            width: 100%;
            height: 200px;
            background-color: #abcdef;
        }
        #contents {
            width: 100%;
            height: 250px;
            background-color: #def;
        }
        #footer {
            width: 100%;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 100px;
            background-color: #f1f;
        }
        #footer .footer2 {
            width: 20%;
            height: 100px;
            background-color: rgb(223, 255, 17);
        }
        #footer .footer3 {
            width: 20%;
            height: 100px;
            background-color: rgb(17, 255, 164);
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <!-- as -->
        <main id="main">
            <article id="slider">
                <div class="link"></div>
            </article>
            <article id="banner"></article>
            <section id="contents"></section>
        </main>
        <!-- m -->
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </footer>
    </div>
</body>
</html>
