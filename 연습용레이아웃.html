<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>연습 레이아웃</title>
    <style>
        * {
            margin: 0;
            position: relative;
        }
        #wrap {
            width: 100%;
        }
        #header {
            width: 100%;
            height: 100px;
            background-color: #21cbf1;
        }
        #header .container .logo {
            width: 20%;
            height: 100px;
            background-color: #f11111;
        }
        #header .container .nav {
            width: 80%;
            height: 100px;
            background-color: #123456;
        }
        #slider {
            width: 100%;
            height: 300px;
        }
        #contents {
            width: 100%;
            height: 200px;
        }
        #contents .container .content1 {
            width: 33.333%;
            height: 200px;
            background-color: #f11;
        }
        #contents .container .content2 {
            width: 33.33%;
            height: 200px;
            background-color: #4f1;
        }
        #contents .container .content3 {
            width: 33.33%;
            height: 200px;
            background-color: #cc7ada;
        }
        #footer {
            width: 100%;
            height: 100px; /* 전체 푸터 높이 지정 */
            background-color: #1250ff;
        }
        #footer .container .footer1 {
            width: 20%;
            height: 100px;
            background-color: #bbfa00;
        }
        #footer .container .footer2 {
            width: 60%;
            height: 100px;
            background-color: #fa4b00;
        }
        #footer .container .footer3 {
            width: 20%;
            height: 100px;
            background-color: #fac000;
        }
        .container {
            width: 1200px;
            height: inherit;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header id="header">
            <div class="container">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </div>
        </header>
        <!-- h -->
        <article id="slider">
            <div class="container"></div>
        </article>
        <!-- s -->
        <main id="contents">
            <div class="container">
                <section class="content1"></section>
                <section class="content2"></section>
                <section class="content3"></section>
            </div>
        </main>
        <!-- c -->
        <footer id="footer">
            <div class="container">
                <div class="footer1"></div>
                <div class="footer2"></div>
                <div class="footer3"></div>
            </div>
        </footer>
    </div>
</body>
</html>
