<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 A-4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 1200px;
            margin: 0 auto;
        }
        #header {
            width: 1200px;
            display: flex;
        }
        #header .logo {
            width: 20%;
            height: 100px;
            background: #0000ff;
        }
        #header .nav {
            width: 80%;
            height: 100px;
            background-color: aqua;
        }
        #slider {
            width: 1200px;
            height: 300px;
            background-color: #f1f1f1;
            background-color: #123456;
        }
        #contents {
            width: 1200px;
            display: flex;
        }
        #contents .content1 {
            width: 33.333%;
            height: 200px;
            background-color: #453211;
        }
        #contents .content2 {
            width: 33.333%;
            height: 200px;
            background-color: #f1e322;
        }
        #contents .content3 {
            width: 33.333%;
            height: 200px;
            background-color: #abcdef;
        }
        #footer {
            width: 1200px;
            display: flex;
        }
        #footer .footer1 {
            width: 80%;
            height: 100px;
            background-color: #f1f2f3;
        }
        #footer .footer1 .footer1-1 {
            width: 100%;
            height: 50px;
            background-color: #a89f2f;
        }
        #footer .footer1 .footer1-2 {
            width: 100%;
            height: 50px;
            background-color: #111fff;
        }
        #footer .footer2 {
            width: 20%;
            height: 100px;
            background-color: #1f1;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <div id="header">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </div>
        <!-- c -->
        <article id="slider"></article>
        <!-- s -->
        <main id="contents">
            <section class="content1"></section>
            <section class="content2"></section>
            <section class="content3"></section>
        </main>
        <!-- co -->
        <footer id="footer">
            <div class="footer1">
                <div class="footer1-1"></div>
                <div class="footer1-2"></div>
            </div>
            <div class="footer2"></div>
        </footer>
        <!-- f -->
    </div>
</body>
</html>
