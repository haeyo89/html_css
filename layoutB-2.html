<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃B-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
        }
        #header {  
            width: 100%;
            background-color: #123456;
        }
        #header .header_container {
            width: 1200px;
            height: 100px;
            display: flex;
            margin: 0 auto;
        }
        #header .header_container .logo {
            width: 20%;
            height: 100px;
            background-color: #1234ff;
        }
        #header .header_container .nav {
            width: 80%;
            height: 100px;
            background-color: #ffaaad;
        }
        #slider {
            width: 1200px;
            height: 300px;
            margin: 0 auto;
            background-color: #654321;
        }
        #contents {
            width: 1200px;
            height: 200px;
            margin: 0 auto;
            display: flex;
        }
        #contents .content1 {
            width: 33.33%;
            height: 200px;
            background-color: #763d5c;
        }
        #contents .content2 {
            width: 33.33%;
            height: 200px;
            background-color: #3d3f76;
        }
        #contents .content3 {
            width: 33.33%;
            height: 200px;
            background-color: #65763d;
        }
        #footer {
            width: 100%;
            height: 100px;
            display: flex;
            background-color: #ff011f;
        }
        #footer .footer_container {
            width: 1200px;
            margin: 0 auto;
            display: flex;
        }
        #footer .footer_container .footer1 {
            width: 80%;
            height: 100px;
            background-color: #fddddd;
        }
        #footer .footer_container .footer2 {
            width: 20%;
            height: 100px;
            background-color: #a92c2c;
        }
        #footer .footer_container .footer2 .footer2-1 {
            width: 100%;
            height: 50px;
            background-color: #0efffe;
        }
        #footer .footer_container .footer2 .footer2-1 {
            width: 100%;
            height: 50px;
            background-color: #cbd517;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header id="header">
            <div class="header_container">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </div>
        </header>
        <!-- h -->
        <article id="slider"></article>
        <!-- s -->
        <main id="contents">
            <section class="content1"></section>
            <section class="content2"></section>
            <section class="content3"></section>
        </main>
        <!-- c -->
        <footer id="footer">
            <div class="footer_container">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
            </div>
        </footer>
        <!-- f -->
    </div>
</body>
</html>
