<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃C-4</title>
    <style>
        * {
            margin: 0;
            position: relative;
        }
        #wrap {
            width: 1000px;
            height: 650px;
            display: flex;
        }
        #aside {
            width: 20%;
            height: 650px;
            background-color: #123456;
        }
        #aside .logo {
            width: 100%;
            height: 100px;
            background-color: #acf;
        }
        #aside .nav {
            width: 100%;
            height: 550px;
            background-color: #13f;
        }
        #main {
            width: 80%;
            height: 350px;
        }
        #slider {
            width: 100%;
            height: 350px;
            background-color: #adf; 
        }
        #contents {
            width: 100%;
            display: flex;
        }
        #contents .content1 {
            width: 33.333%;
            height: 200px;
            background-color: #34f;
        }
        #contents .content2 {
            width: 33.333%;
            height: 200px;
            background-color: #112fff;
        }
        #contents .content3 {
            width: 33.333%;
            height: 200px;
            background-color: #a1f;
        }
        #footer {
            width: 100%;
            height: 100px;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 100px;
            background-color: #f1ffaa;
        }
        #footer .footer2 {
            width: 60%;
            height: 100px;
            background-color: #ffaaf1;
        }
        #footer .footer3 {
            width: 20%;
            height: 100px;
            background-color: #bfaaff;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <!-- as -->
        <main id="main">
        <article id="slider"></article>
        <!-- s -->
        <section id="contents">
            <article class="content1"></article>
            <article class="content2"></article>
            <article class="content3"></article>
        </section>
        <!-- c -->
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </footer>
        <!-- f -->
        </main>
    </div>
</body>
</html>
