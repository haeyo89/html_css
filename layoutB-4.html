<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 B-4</title>
    <style>
        * {
            margin: 0;
            position: relative;
        }
        #wrap {
            width: 100%;
        }
        #header {
            width: 100%;
            background-color: #2200ff9d;
        }
        #header .container .logo {
            width: 20%;
            height: 100px;
            background-color: #adcbd8;
        }
        #header .container .nav {
            width: 80%;
            height: 100px;
            background-color: #37bbf3;
        }
        #slider {
            width: 100%;
            height: 300px;
        }
        #contents {
            width: 100%;
            height: 200px;z
        }
        #contents .container .content1 {
            width: 33.3333%;
            height: 200px;
            background-color: #dbcba2;
        }
        #contents .container .content2 {
            width: 33.3333%;
            height: 200px;
            background-color: #f1faad;
        }
        #contents .container .content3 {
            width: 33.3333%;
            height: 200px;
            background-color: #ffaaff;
        }
        #footer {
            width: 100%;
            height: 100px;
            background-color: #5a696d;
        }
        #footer .footer1 {
            width: 80%;
        }
        #footer .container .footer1 .footer1-1 {
            width: 100%;
            height: 50px;
            background-color: #06cdff; 
        }
        #footer .container .footer1 .footer1-2 {
            width: 100%;
            height: 50px;
            background-color: #271fff;
        }
        #footer .container .footer2 {
            width: 20%;
            height: 100px;
            background-color: #123456;
        }
        .container {
            width: 1200px;
            height: inherit;
            margin: 0 auto;
            background-color: rgba(0, 0, 0, 0.2);
            display: flex;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header id="header">
            <div class="container">
                <h1 class="logo"></h1>
                <nav class="nav"></nav>
            </div>
        </header>
        <!-- h -->
        <article id="slider">
            <div class="container"></div>
        </article>
        <!-- s -->
        <main id="contents">
            <div class="container">
                <section class="content1"></section>
                <section class="content2"></section>
                <section class="content3"></section>
            </div>
        </main>
        <!-- c -->
        <footer id="footer">
            <div class="container">
                <div class="footer1">
                    <div class="footer1-1"></div>
                    <div class="footer1-2"></div>
                </div>
                <div class="footer2"></div>
            </div>
        </footer>
        <!-- f -->
    </div>
</body>
</html>
