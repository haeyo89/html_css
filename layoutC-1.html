<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 C-1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 1000px;
            display: flex;
        }
        #aside {
            width: 20%;
            height: 650px;
            background-color: #123456;
        }
        #aside .logo {
            width: 100%;
            height: 100px;
            background-color: #2fb8e1;
        }
        #aside .nav {
            width: 100%;
            height: 550px;
            background-color: #1139ff;
        }
        #main {
            width: 80%;
            height: 650px;
            background-color: #15f;
        }
        #slider {
            width: 100%;
            height: 350px;
            background-color: #8793d2;
        }
        #contents {
            width: 100%;
            display: flex;
        }
        #contents .content1 {
            width: 33.33%;
            height: 200px;
            background-color: #fedead;
        }
        #contents .content2 {
            width: 33.33%;
            height: 200px;
            background-color: #f1f;
        }
        #contents .content3 {
            width: 33.33%;
            height: 200px;
            background-color: #0022ff;
        }
        #footer {
            width: 100%;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 100px;
            background-color: #a0f;
        }
        #footer .footer2 {
            width: 80%;
            height: 100px;
            background-color: #4311ff;
        }
        #footer .footer2 .footer2-1 {
            width: 100%;
            height: 50px;
            background: #929292;
        }
        #footer .footer2 .footer2-2 {
            width: 100%;
            height: 50px;
            background: #9292ff;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <!-- as -->
        <main id="main">
            <article id="slider"></article>
            <!-- s -->
            <section id="contents">
                <article class="content1"></article>
                <article class="content2"></article>
                <article class="content3"></article>
            </section>
            <!-- c -->
            <footer id="footer">
                <div class="footer1"></div>
                <div class="footer2">
                    <div class="footer2-1"></div>
                    <div class="footer2-2"></div>
                </div>
            </footer>
        </main>
    </div>
</body>
</html>
