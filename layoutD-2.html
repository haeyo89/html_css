<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 D-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
        }
        #aside {
            width: 200px;
            height: 650px;
            background-color: #123456;
        }
        #aside .logo {
            width: 100%;
            height: 150px;
            background-color: #12fff1;
        }
        #aside .nav {
            width: 100%;
            height: 500px;
            background-color: rgb(73, 17, 255);
        }
        #main {
            width: calc(100% - 200px);
            height: 650px;
            background-color: #a1f;
        }
        #slider {
            width: 100%;
            height: 400px;
            background-color: rgb(17, 255, 172);
        }
        #contents {
            width: 100%;
            display: flex;
        }
        #contents .content1 {
            width: 50%;
            height: 250px;
            background-color: #1234ff
        }
        #contents .content2 {
            width: 50%;
            height: 250px;
            background-color: #ecb9b9;
        }
        #footer {
            width: 100%;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 100px;
            background-color: rgb(231, 255, 17);
        }
        #footer .footer2 {
            width: 60%;
            height: 100px;
            background-color: rgb(17, 255, 207);
        }
        #footer .footer3 {
            width: 20%;
            height: 100px;
            background-color: rgb(255, 61, 17);
        }
    </style>
</head>
<body>
    <div id="wrap">
        <aside id="aside">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </aside>
        <main id="main">
            <article id="slider">
                <div class="lmage"></div>
                <div class="banner"></div>
            </article>
            <section id="contents">
                <section class="content1"></section>
                <section class="content2"></section>
            </section>
        </main>
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2"></div>
            <div class="footer3"></div>
        </footer>
    </div>
</body>
</html>
