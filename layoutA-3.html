<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹디자인개발기능사 레이아웃 A-3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #wrap {
            width: 1200px;
            margin: 0 auto;
        }
        #header {
            width: 1200px;
            height: 100px;
            background-color: #f1f1f1;
        }
        #header .logo {
            width: 20%;
            height: 100px;
            background-color: #d4d4d4;
        }
        #header .nav {
            width: 80%;
            height: 100px;
            background-color: #f2f2f2
        } 
        #slider {
            width: 1200px;
            height: 300px;
            background-color: #14f;
        }
        #contents {
            width: 1200px;
            display: flex;
        }
        #contents .content1 {
            width: 33.3333%;
            height: 200px;
            background-color: #00f;
        }
        #contents .content2 {
            width: 33.3333%;
            height: 200px;
            background-color: #15f;
        }
        #contents .content3 {
            width: 33.3333%;
            height: 200px;
            background-color: #99f;
        }
        #footer {
            width: 1200px;
            display: flex;
        }
        #footer .footer1 {
            width: 20%;
            height: 100px;
            background-color: #127;
        }
        #footer .footer2 {
            width: 80%;
        }
        #footer .footer2 .footer2-1 {
            width: 100%;
            height: 50px;
            background-color: #123;
        }
        #footer .footer2 .footer2-2 {
            width: 100%;
            height: 50px;
            background-color: #129;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <header id="header">
            <h1 class="logo"></h1>
            <nav class="nav"></nav>
        </header>

        <article id="slider"></article>
        
        <main id="contents">
        <section class="content1"></section>
        <section class="content2"></section>
        <section class="content3"></section>
        </main>
        
        <footer id="footer">
            <div class="footer1"></div>
            <div class="footer2">
                <div class="footer2-1"></div>
                <div class="footer2-2"></div>
            </div>
        </footer>

    </div>
</body>
</html>
